<section class="flex flex-col md:flex-row items-center justify-center gap-12 md:gap-16 py-32 lg:py-40">
  <div class="flex-shrink-0 flex justify-center relative group">
    <div
      class="absolute -inset-1 bg-gradient-to-r from-purple-500 to-cyan-500 rounded-full blur opacity-50 group-hover:opacity-75 transition duration-500">
    </div>
    <img src="assets/myPic.png" alt="Sua foto de perfil"
      class="relative w-48 h-48 sm:w-56 sm:h-56 md:w-64 md:h-64 rounded-full object-cover border-4 border-slate-200/80 dark:border-slate-900/50 shadow-2xl transition-transform duration-500 group-hover:scale-105" />
  </div>
  <div class="max-w-2xl w-full flex flex-col items-center md:items-start text-center md:text-left z-10">
    <span class="text-4xl sm:text-5xl md:text-5xl lg:text-6xl font-extrabold tracking-tight text-slate-800 dark:text-white mb-2">{{
      'HOME.TITLE' | translate }}</span>
    <h1
      class="text-5xl sm:text-6xl md:text-7xl lg:text-8xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-purple-600 to-cyan-600 dark:from-purple-400 dark:to-cyan-400 mb-6 pb-2">
      Guilherme Fernandes Pavezzi</h1>
    <p class="text-base sm:text-lg md:text-xl text-slate-600 dark:text-violet-100/80 mb-8 leading-relaxed max-w-xl font-medium">
      {{ 'HOME.DESCRIPTION' | translate }}
    </p>
    <div class="flex flex-row items-center gap-6">
      <a href="https://github.com/guipavezzi" target="_blank"
        class="flex items-center justify-center w-14 h-14 bg-white/60 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-full text-slate-600 dark:text-violet-100 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/10 hover:shadow-lg dark:hover:shadow-[0_0_15px_rgba(255,255,255,0.3)] transition-all duration-300 hover:-translate-y-1">
        <span class="icon-[mdi--github] text-3xl"></span>
      </a>
      <a href="https://www.linkedin.com/in/guilherme-fernandes-pavezzi-029361206/" target="_blank"
        class="flex items-center justify-center w-14 h-14 bg-white/60 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-full text-slate-600 dark:text-violet-100 hover:text-cyan-600 dark:hover:text-white hover:bg-cyan-50 dark:hover:bg-cyan-500/20 hover:border-cyan-300 dark:hover:border-cyan-500/50 hover:shadow-lg dark:hover:shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all duration-300 hover:-translate-y-1">
        <span class="icon-[mdi--linkedin] text-3xl"></span>
      </a>
      <button [cdkMenuTriggerFor]="emailMenu"
        class="flex items-center justify-center w-14 h-14 bg-white/60 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-full text-slate-600 dark:text-violet-100 hover:text-red-600 dark:hover:text-white hover:bg-red-50 dark:hover:bg-red-500/20 hover:border-red-300 dark:hover:border-red-500/50 hover:shadow-lg dark:hover:shadow-[0_0_15px_rgba(239,68,68,0.4)] transition-all duration-300 hover:-translate-y-1">
        <span class="icon-[mdi--gmail] text-3xl"></span>
      </button>

      <ng-template #emailMenu>
        <div class="flex flex-col bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 py-2 w-52 overflow-hidden" cdkMenu>
          <button cdkMenuItem class="px-4 py-3 text-left hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-violet-100 flex items-center gap-3 transition-colors duration-200 focus:outline-none focus:bg-slate-100 dark:focus:bg-slate-700 font-medium"
                  (click)="copyEmail()">
            <span class="icon-[mdi--content-copy] text-2xl text-slate-500 dark:text-slate-400"></span> Copiar Email
          </button>
          <a cdkMenuItem class="px-4 py-3 text-left hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-violet-100 flex items-center gap-3 transition-colors duration-200 focus:outline-none focus:bg-slate-100 dark:focus:bg-slate-700 font-medium"
             href="https://mail.google.com/mail/?view=cm&fs=1&to=gui.pavezzi07@gmail.com" target="_blank">
            <span class="icon-[mdi--gmail] text-2xl text-red-500"></span> Abrir no Gmail
          </a>
          <a cdkMenuItem class="px-4 py-3 text-left hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-violet-100 flex items-center gap-3 transition-colors duration-200 focus:outline-none focus:bg-slate-100 dark:focus:bg-slate-700 font-medium"
             href="https://outlook.live.com/mail/0/deeplink/compose?to=gui.pavezzi07@gmail.com" target="_blank">
            <span class="icon-[mdi--microsoft-outlook] text-2xl text-blue-500"></span> Abrir no Outlook
          </a>
        </div>
      </ng-template>
    </div>
  </div>
</section>
